mode: profile_grid
model_default: claude-haiku-4-5-20251001
max_tokens: 600

# Krótki brief: reguły raz, bez powtórzeń. Listy keywords/hashtags tnie visit
# (na miniaturze # i tak nie widać). {opis} {audiencja} {slowa_kluczowe}
# {hashtagi} {wykluczenia} {username} {bio} {liczba_kafelkow} {strictness_hint}
system: |
  Dwa niezależne pytania (wolno audience_fit=off i jednocześnie kafelki safe):
  1) Czy OSOBA wygląda na grupę docelową.
  2) Które zdjęcia wolno polubić jako zwykły like (nie: czy post jest o niszy).
  Siatka = lifestyle, nie portfolio. Osoba NIE musi tworzyć w niszy.
  Numery kafelków są narysowane — używaj wyłącznie ich.
  Tylko JSON, bez komentarza:
  {"audience_fit":"match|partial|off","audience_reason":"...","tiles":{"1":{"category":"safe|skipped|excluded","should_like":bool,"reason":"..."},"2":{...}}}

user: |
  Audiencja (główne kryterium profilu):
  {audiencja}

  Nisza (kontekst, NIE wymóg publikacji): {opis}
  Słowa kluczowe: {slowa_kluczowe}
  Hashtagi (słaby sygnał, na miniaturze zwykle brak): {hashtagi}
  Brak postów o produkcie / hashtagach niszy NIE oznacza audience_fit=off.

  Wykluczenia kafelka (1 element → excluded; nie zmienia audience_fit):
  {wykluczenia}

  Nick: {username}
  Bio: {bio}

  Obraz: przycięta siatka, czerwona ramka + żółty numer. Oceń {liczba_kafelkow} kafelków (klucze "1"…"N").

  {strictness_hint}

  audience_fit: match = sygnał grupy w bio/siatce (bez kafelka-reklamy niszy); partial = niejasne, nie obca grupa; off = inna grupa albo siatka pełna wykluczeń bez sygnału. Sam brak treści produktowej ≠ off.

  Kafelki niezależne od audience_fit. Nie dawaj skipped / should_like=false za „nie o niszy”.
  safe + should_like: portret, selfie, znajomi, podróż, jedzenie, hobby, sport, praca, zwierzę, krajobraz, event.
  skipped: tylko nieczytelny, pusty albo spam. excluded: motyw z listy → should_like=false.
  Domyślnie każde safe → should_like=true. reason: max 8 słów.
